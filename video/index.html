<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0a0908; }
      #root {
        position: relative; width: 1080px; height: 1080px;
        overflow: hidden; background: #14120f;
      }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
      .clip { position: absolute; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1080">

      <div id="el-01-open" class="scene" data-composition-id="01-open" data-composition-src="compositions/frames/01-open.html" data-start="0" data-duration="4.5" data-track-index="0"></div>
      <div id="el-02-orbit" class="scene" data-composition-id="02-orbit" data-composition-src="compositions/frames/02-orbit.html" data-start="4.5" data-duration="4.5" data-track-index="0"></div>
      <div id="el-03-strike" class="scene" data-composition-id="03-strike" data-composition-src="compositions/frames/03-strike.html" data-start="9" data-duration="5.5" data-track-index="0"></div>
      <div id="el-04-burn" class="scene" data-composition-id="04-burn" data-composition-src="compositions/frames/04-burn.html" data-start="14.5" data-duration="6" data-track-index="0"></div>
      <div id="el-05-real" class="scene" data-composition-id="05-real" data-composition-src="compositions/frames/05-real.html" data-start="20.5" data-duration="5" data-track-index="0"></div>
      <div id="el-06-end" class="scene" data-composition-id="06-end" data-composition-src="compositions/frames/06-end.html" data-start="25.5" data-duration="4.5" data-track-index="0"></div>

      <video id="v-open" src="assets/footage/beat1-open.mp4" preload="auto" data-media-start="0" muted playsinline class="clip" style="left:54px;top:120px;width:972px;height:547px;object-fit:cover" data-start="0" data-duration="4.5" data-track-index="1001"></video>
      <video id="v-orbit" src="assets/footage/beat2-orbit.mp4" preload="auto" data-media-start="0" muted playsinline class="clip" style="left:54px;top:120px;width:972px;height:547px;object-fit:cover" data-start="4.5" data-duration="4.5" data-track-index="1002"></video>
      <video id="v-strike" src="assets/footage/beat3-strike.mp4" preload="auto" data-media-start="0" muted playsinline class="clip" style="left:54px;top:120px;width:972px;height:547px;object-fit:cover" data-start="9" data-duration="5.5" data-track-index="1003"></video>
      <video id="v-burn" src="assets/footage/beat4-burn.mp4" preload="auto" data-media-start="0" muted playsinline class="clip" style="left:54px;top:120px;width:972px;height:547px;object-fit:cover" data-start="14.5" data-duration="6" data-track-index="1004"></video>
      <video id="v-real" src="assets/footage/beat6-real.mp4" preload="auto" data-media-start="0" muted playsinline class="clip" style="left:54px;top:120px;width:972px;height:547px;object-fit:cover" data-start="20.5" data-duration="5" data-track-index="1005"></video>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
